# ============================================================
# MarsRankup - Rank Definitions
# Theme: Orange + Silver
# ============================================================
# Number suffixes: 1k, 1.5m, 2b, 1t
# Time: 30m, 1h, 2d, 1w, or combinations such as 1d12h.
# Custom requirement operators: >=, <=, >, <, ==, !=

ranks:
  1:
    display-name: "&#FF8A1F&lBronze I"
    money-required: "1k"
    playtime-required: "1h"
    permissions-required: []
    custom-requirements:
      - "%vault_eco_balance% >= 1k"
      - "%levelsplus_level% >= 2"

    item:
      slot: 20
      material: COPPER_INGOT
      amount: 1
      glow: false

      claimed:
        name: "&#BFC5CC&lBRONZE I &8• &#BFC5CCCLAIMED"
        lore:
          - ""
          - "&#8F98A3You already unlocked this rank."
          - ""
          - "&#BFC5CC✔ Claimed"

      in-progress:
        name: "&#FF8A1F&lBRONZE I &8• &#BFC5CCIN PROGRESS"
        lore:
          - ""
          - "&#8F98A3Balance: &#BFC5CC%marsrankup_requirement_money_1%"
          - "&#8F98A3Playtime: &#BFC5CC%marsrankup_requirement_playtime_1%"
          - "&#8F98A3Custom requirements: &#BFC5CC%marsrankup_requirement_custom_1%"
          - ""
          - "&#8F98A3Complete every requirement to continue."

      claimable:
        name: "&#FF8A1F&lBRONZE I &8• &#FF8A1FCLICK TO CLAIM"
        lore:
          - ""
          - "&#BFC5CCAll requirements have been completed."
          - "&#FF8A1FClick to claim this rank."
        glow: true
        actions:
          - "[SOUND] UI_BUTTON_CLICK 1 1.2"

    rewards:
      - "[CONSOLE] say %player% has reached Bronze I!"
      - "[CONSOLE] lp user %player% parent add rank1"
      - "[MESSAGE] &#FF8A1FCongratulations! &#BFC5CCYou unlocked Bronze I."
      - "[SOUND] UI_TOAST_CHALLENGE_COMPLETE 1 1"

  2:
    display-name: "&#BFC5CC&lSilver II"
    money-required: "5k"
    playtime-required: "1d"
    permissions-required:
      - "marsrankup.rank2.access"
    custom-requirements:
      - "%levelsplus_level% >= 5"

    item:
      slot: 22
      material: IRON_INGOT
      amount: 1
      glow: false

      claimed:
        name: "&#BFC5CC&lSILVER II &8• &#BFC5CCCLAIMED"
        lore:
          - ""
          - "&#8F98A3You already unlocked this rank."

      in-progress:
        name: "&#BFC5CC&lSILVER II &8• &#FF8A1FIN PROGRESS"
        lore:
          - ""
          - "&#8F98A3Balance: &#BFC5CC%marsrankup_requirement_money_2%"
          - "&#8F98A3Playtime: &#BFC5CC%marsrankup_requirement_playtime_2%"
          - "&#8F98A3Permissions: &#BFC5CC%marsrankup_requirement_permissions_2%"
          - "&#8F98A3Custom: &#BFC5CC%marsrankup_requirement_custom_2%"

      claimable:
        name: "&#FF8A1F&lSILVER II &8• &#FF8A1FCLICK TO CLAIM"
        lore:
          - ""
          - "&#BFC5CCEverything is ready."
          - "&#FF8A1FClick to unlock Silver II."
        glow: true
        actions:
          - "[SOUND] UI_BUTTON_CLICK 1 1.2"

    rewards:
      - "[CONSOLE] lp user %player% parent add rank2"
      - "[MESSAGE] &#FF8A1FCongratulations! &#BFC5CCYou unlocked Silver II."
      - "[SOUND] UI_TOAST_CHALLENGE_COMPLETE 1 1"
