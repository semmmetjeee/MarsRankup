name: Build

on:
  push:
    branches:
      - main
      - license-english-overhaul
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn -B -ntp -Drevision=dev clean package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: MarsRankup-dev
          path: target/MarsRankup-dev.jar
          if-no-files-found: error
