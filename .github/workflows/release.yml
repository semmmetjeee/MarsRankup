name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$VERSION" ]]; then
            echo "Could not resolve a version from tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release jar
        run: mvn -B -ntp -Drevision="${{ steps.version.outputs.version }}" clean package

      - name: Create GitHub Release and upload jar
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          JAR="target/MarsRankup-${VERSION}.jar"
          test -f "$JAR"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$JAR" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$JAR"               --title "MarsRankup $GITHUB_REF_NAME"               --generate-notes
          fi
